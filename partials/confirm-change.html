<!-- Confirmation dialog. Loaded by assets/js/partials.js, driven by assets/js/confirm-modal.js.
     Opens over a preview popup and collects the change reason before the save goes through. -->
<div class="modal-panel bg-white w-full max-w-lg border border-neutral-300 shadow-2xl my-4 sm:my-8"
  role="document">

  <div class="flex items-start justify-between gap-4 px-4 sm:px-6 pt-5 pb-4 border-b border-neutral-200">
    <h2 id="confirm-modal-title" class="text-xl sm:text-2xl font-normal text-neutral-800">Confirm Changes</h2>
    <button type="button" data-confirm-close title="Close" aria-label="Close"
      class="shrink-0 h-9 w-9 flex items-center justify-center border border-neutral-400 bg-neutral-700
             hover:bg-neutral-900 text-white rounded-sm shadow-sm transition-colors">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
  </div>

  <div class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6">
    <p data-confirm-error hidden
      class="mb-4 border border-red-300 bg-red-50 text-red-800 text-sm px-3 py-2">
      Enter a change reason before confirming.
    </p>

    <p class="text-sm text-neutral-700 mb-4" data-cell="message"></p>

    <label class="f-label" for="confirm-change-reason">
      <span class="f-req" aria-hidden="true">*</span> Change Reason
    </label>
    <textarea id="confirm-change-reason" rows="3" class="f-input" data-field="changeReason"
      placeholder="Why is this changing?"></textarea>
  </div>

  <div class="modal-actions">
    <button type="button" class="btn" data-confirm-accept>Confirm</button>
    <button type="button" class="btn btn-cancel" data-confirm-close>Cancel</button>
  </div>
</div>
