<!-- Add New Term dialog. Loaded by assets/js/partials.js, driven by assets/js/term-modal.js.
     Field hooks match a term period, so the values map straight onto charge.termPeriods. -->
<div class="modal-panel bg-white w-full max-w-3xl border border-neutral-300 shadow-2xl my-4 sm:my-8"
  role="document">

  <div class="flex flex-wrap items-center gap-3 px-4 sm:px-6 pt-5 pb-4 border-b border-neutral-200">
    <h2 id="term-modal-title" class="order-1 mr-auto text-xl sm:text-2xl font-normal text-neutral-800">
      Add New Term <span class="acc-range" data-cell="step"></span>
    </h2>

    <button type="button" data-term-close title="Close" aria-label="Close"
      class="order-2 sm:order-3 shrink-0 h-9 w-9 flex items-center justify-center border border-neutral-400
             bg-neutral-700 hover:bg-neutral-900 text-white rounded-sm shadow-sm transition-colors">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
    </button>
  </div>

  <div class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6">

  <!-- Step 1: the term configuration -->
  <div data-step="1">
    <p data-term-error hidden
      class="mb-4 border border-red-300 bg-red-50 text-red-800 text-sm px-3 py-2">
      Enter a start date for the new term.
    </p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
      <div>
        <label class="f-label"><span class="f-req" aria-hidden="true">*</span> Start Date</label>
        <div class="f-date">
          <input type="text" class="f-input" data-field="termsStartDate" placeholder="YYYY/MM/DD" />
          <button type="button" class="f-cal" title="Choose date" aria-label="Choose start date">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="17" rx="2" /><path d="M8 2v4M16 2v4M3 10h18" />
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label class="f-label">Monthly Amount</label>
        <div class="flex gap-2">
          <div class="seg shrink-0" role="group" aria-label="Has monthly amount"
            data-toggle-field="hasInitialAmount">
            <button type="button" data-yesno="No" aria-pressed="true">No</button>
            <button type="button" data-yesno="Yes" aria-pressed="false">Yes</button>
          </div>
          <input type="number" step="0.01" class="f-input" data-field="initialAmount" placeholder="0.00"
            data-when-field="hasInitialAmount" data-when-value="Yes" />
        </div>
      </div>

      <div>
        <label class="f-label"><span class="f-req" aria-hidden="true">*</span> Billing Frequency</label>
        <select class="f-select" data-field="billingFrequency">
          <option>Monthly</option>
          <option>Quarterly</option>
          <option>Semi-Annual</option>
          <option>Annual</option>
        </select>
      </div>

      <div class="hidden md:block" aria-hidden="true"></div>

      <div>
        <label class="f-label"><span class="f-req" aria-hidden="true">*</span> Escalation Frequency (months)</label>
        <input type="text" class="f-input" data-field="escalationFrequency" value="12" />
      </div>

      <div>
        <label class="f-label">Escalation Anniversary</label>
        <div class="flex gap-2">
          <div class="seg shrink-0" role="group" aria-label="Escalates with lease commencement"
            data-toggle-field="escalatesWithCommencement">
            <button type="button" data-yesno="No" aria-pressed="true">No</button>
            <button type="button" data-yesno="Yes" aria-pressed="false">Yes</button>
          </div>
          <div data-when-field="escalatesWithCommencement" data-when-value="Yes" class="f-date">
            <input type="text" class="f-input" data-field="escalationAnniversary" placeholder="YYYY/MM/DD" />
            <button type="button" class="f-cal" title="Choose date" aria-label="Choose escalation anniversary">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="17" rx="2" /><path d="M8 2v4M16 2v4M3 10h18" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div>
        <label class="f-label"><span class="f-req" aria-hidden="true">*</span> Escalation Type and Amount</label>
        <div class="flex gap-2">
          <select class="f-select sm:max-w-[12rem]" data-field="escalationType">
            <option>CPI</option>
            <option>Fixed</option>
            <option>Percentage</option>
            <option>None</option>
          </select>
          <input type="text" class="f-input" data-field="escalationAmount" placeholder="Escalation Amount"
            data-when-field="escalationType" data-when-value="Fixed|Percentage" />
        </div>
      </div>

      <div data-when-field="escalationType" data-when-value="CPI">
        <label class="f-label">CPI Index</label>
        <div class="flex gap-2">
          <select class="f-select sm:max-w-[12rem]" data-field="cpiIndex">
            <option>IPC For USA</option>
            <option>IPC Colombia</option>
            <option>CPI-U All Items</option>
          </select>
          <input type="text" class="f-input" data-field="cpiAdjustment" placeholder="CPI Percentage Adjustment" />
        </div>
      </div>
    </div>

  </div>

  <!-- Step 2: what this configuration would create -->
  <div data-step="2" hidden>
    <div data-preview-host></div>
  </div>

  </div>

  <div class="modal-actions">
    <button type="button" class="btn" data-step-btn="2" data-term-back hidden>Back</button>
    <button type="button" class="btn" data-step-btn="1" data-term-next>Next</button>
    <button type="button" class="btn" data-step-btn="2" data-term-save hidden>Save</button>
    <button type="button" class="btn btn-cancel" data-term-close>Cancel</button>
  </div>
</div>
